[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superprompter-sdk"  # The name on PyPI 
version = "0.2.0"
authors = [
  { name="Sainskrut (sushrut) Kulkarni", email="info@promptsgenerator.ai" },
]
description = "A Python client for the SuperPrompter Web Search API"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
"Homepage" = "https://promptsgenerator.ai"
"Bug Tracker" = "https://promptsgenerator.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
